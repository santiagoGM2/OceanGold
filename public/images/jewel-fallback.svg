<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Anillo de oro Ocean Gold">
  <defs>
    <!-- Halo dorado de fondo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#c9a84c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <!-- Gradiente para el aro: simula reflexión metálica -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c6336"/>
      <stop offset="25%" stop-color="#d4b461"/>
      <stop offset="50%" stop-color="#fff3c8"/>
      <stop offset="75%" stop-color="#d4b461"/>
      <stop offset="100%" stop-color="#7c6336"/>
    </linearGradient>
    <!-- Gradiente para la elipse inferior (sombra del aro) -->
    <linearGradient id="ring-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c6336" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a2f1a" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Gradiente para la gema central -->
    <radialGradient id="gem" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fff3c8"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </radialGradient>
    <!-- Brillo sutil -->
    <radialGradient id="gem-sparkle" cx="35%" cy="30%" r="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo de fondo -->
  <circle cx="300" cy="300" r="280" fill="url(#halo)"/>

  <!-- Sombra base del aro (elipse vista en perspectiva) -->
  <ellipse cx="300" cy="370" rx="170" ry="35" fill="url(#ring-shadow)" opacity="0.45"/>

  <!-- Aro principal con grosor -->
  <g transform="translate(300 320)">
    <ellipse cx="0" cy="0" rx="170" ry="40" fill="none" stroke="url(#ring)" stroke-width="32"/>
    <!-- Reflejo superior -->
    <path d="M -160 -5 Q -90 -38 0 -40 Q 90 -38 160 -5" fill="none" stroke="#fff3c8" stroke-width="3" stroke-opacity="0.55"/>
    <!-- Highlight izquierdo -->
    <path d="M -168 -2 Q -158 -22 -130 -32" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- Engaste de la gema (base metálica) -->
  <g transform="translate(300 230)">
    <polygon points="0,-12 22,4 18,28 -18,28 -22,4" fill="#7c6336" stroke="#d4b461" stroke-width="2"/>
  </g>

  <!-- Gema central -->
  <g transform="translate(300 200)">
    <polygon points="0,-50 38,-15 24,40 -24,40 -38,-15" fill="url(#gem)" stroke="#fff3c8" stroke-width="1.5"/>
    <!-- Facetas internas -->
    <polygon points="0,-50 0,40 24,40 38,-15" fill="#ffffff" fill-opacity="0.12"/>
    <polygon points="0,-50 -38,-15 -24,40 0,40" fill="#000000" fill-opacity="0.05"/>
    <line x1="0" y1="-50" x2="0" y2="40" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8"/>
    <line x1="-38" y1="-15" x2="38" y2="-15" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <!-- Sparkle -->
    <ellipse cx="-10" cy="-20" rx="10" ry="14" fill="url(#gem-sparkle)"/>
    <circle cx="14" cy="20" r="2.5" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Pequeño reflejo en el aro derecho -->
  <ellipse cx="455" cy="318" rx="6" ry="14" fill="#fff3c8" opacity="0.75"/>
</svg>
